 .home-page{max-width:760px;margin:15px auto 0}.home-intro{margin-bottom:19px}.home-intro h1{font-size:27px;letter-spacing:-1px;margin:0}.home-intro p{color:var(--muted);margin:7px 0 0}.photo-stage{position:relative;display:grid;place-items:center;width:100%;height:min(48vh,380px);min-height:210px;border:1px dashed #cbd8cc;border-radius:20px;background:#edf2ec;overflow:hidden;color:#66766a;padding:0}.photo-stage img{width:100%;height:100%;object-fit:cover}.photo-placeholder{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px}.photo-placeholder strong{font-size:14px}.photo-placeholder span:last-child{font-size:11px;color:#89948b}.photo-symbol{font-size:30px;color:#729078}.photo-change{position:absolute;right:13px;bottom:13px;background:#ffffffed;border-radius:9px;padding:8px 11px;font-size:11px;font-weight:700;color:#526455}.home-nav-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.home-nav-card{display:flex;align-items:center;gap:13px;text-align:left;padding:17px;background:#fff;border:1px solid #edf0ed;border-radius:16px;box-shadow:var(--shadow);color:var(--ink)}.home-nav-card>span:nth-child(2){display:flex;flex:1;flex-direction:column;gap:5px}.home-nav-card strong{font-size:14px}.home-nav-card small{font-size:11px;color:var(--muted)}.home-nav-icon{width:40px;height:40px;border-radius:13px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:21px}.home-nav-arrow{font-size:23px;color:#9aa49b}.page-nav{max-width:1200px;margin:0 auto 14px;align-items:center;gap:8px}.page-nav:not([hidden]){display:flex}.back-home,.page-tab{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 13px;color:#58645a;font-weight:700;font-size:12px}.back-home{margin-right:auto}.page-tab.active{background:var(--green-soft);border-color:#dce9de;color:var(--green)}#appPages{display:none}#appPages.visible{display:grid}#appPages.page-calendar{grid-template-columns:minmax(0,1.4fr) minmax(280px,.7fr)}#appPages.page-calendar .filters-card{display:none}#appPages.page-filters{grid-template-columns:1fr}#appPages.page-filters .calendar-card,#appPages.page-filters .events-card{display:none}#appPages.page-filters .right-col{display:block} #appPages.page-calendar{grid-template-columns:1fr}#appPages.page-calendar .right-col{display:none}#appPages.page-filters .right-col{display:block}.calendar-card>.events-card{margin-top:20px}#addEventBtn[hidden]{display:none}@media(max-width:580px){.calendar-card .card-head{display:grid;grid-template-columns:1fr auto;gap:10px}.calendar-card .card-head .card-title{grid-column:1;grid-row:1}.calendar-card .card-head .month-nav{grid-column:1;grid-row:2;justify-self:start}.calendar-card .card-head #addEventBtn{grid-column:2;grid-row:1/3;padding:9px 10px;font-size:11px;white-space:nowrap}}.photo-remove{position:absolute;top:13px;right:13px;border:0;border-radius:9px;padding:8px 11px;background:#ffffffed;color:#9b5148;font-size:11px;font-weight:700}.photo-stage[role="button"]{cursor:pointer}.photo-stage:focus-visible{outline:3px solid #82a18a;outline-offset:3px} .home-nav-cards{grid-template-columns:repeat(3,minmax(0,1fr))}.settings-card{display:none;padding:22px}.page-settings{grid-template-columns:1fr!important}.page-settings .calendar-card,.page-settings .right-col{display:none!important}.page-settings .settings-card{display:block}.settings-section{border:1px solid #edf0ed;border-radius:14px;padding:16px}.settings-copy{display:flex;flex-direction:column;gap:5px}.settings-copy strong{font-size:13px}.settings-copy span{font-size:11px;color:var(--muted)}.settings-photo-preview{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:14px}.settings-actions{display:flex;gap:9px;margin-top:14px}.settings-actions button{font-size:12px}@media(max-width:700px){.home-nav-cards{grid-template-columns:1fr 1fr}.settings-card{padding:17px}}</style></head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="brand-mark">⌂</div>우리집 루틴</div><div class="top-actions"><span class="family">📱 개인용 · 내 기기 저장</span><button class="family" id="installBtn" hidden>앱 설치</button><div class="avatar">나</div></div></header>

<section id="homePage" class="home-page"><div class="home-intro"><div class="eyebrow">우리 가족의 하루</div><p>일정과 집안 관리를 한 곳에서 함께 챙겨요.</p></div><div id="photoStage" class="photo-stage"><img id="homePhoto" alt="우리집 홈 사진" hidden><span id="photoPlaceholder" class="photo-placeholder"><span class="photo-symbol">▧</span><strong>우리집 사진을 올려보세요</strong><span>설정에서 메인 사진을 관리할 수 있어요</span></span></div><div class="home-nav-cards"><button class="home-nav-card" data-open-page="calendar"><span class="home-nav-icon">▦</span><span><strong>캘린더</strong><small>일정 확인과 등록</small></span><span class="home-nav-arrow">›</span></button><button class="home-nav-card" data-open-page="filters"><span class="home-nav-icon">◉</span><span><strong>필터</strong><small>교체 주기 관리</small></span><span class="home-nav-arrow">›</span></button><button class="home-nav-card" data-open-page="settings"><span class="home-nav-icon">⚙</span><span><strong>설정</strong><small>사진과 앱 관리</small></span><span class="home-nav-arrow">›</span></button></div></section><nav id="pageNav" class="page-nav" hidden><button class="back-home" id="backHome">‹ 홈</button><button class="page-tab" data-show-page="calendar">캘린더</button><button class="page-tab" data-show-page="filters">필터</button><button class="page-tab" data-show-page="settings">설정</button></nav><main id="appPages" class="layout page-calendar"><section class="card calendar-card"><div class="card-head"><div class="card-title">캘린더</div><div class="month-nav"><button class="icon-btn" id="prevMonth" aria-label="이전 달">‹</button><div class="month-label" id="monthLabel"></div><button class="icon-btn" id="nextMonth" aria-label="다음 달">›</button></div><button class="primary" id="addEventBtn">＋ 일정 추가</button></div><div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="days" id="calendarDays"></div><div class="today-note"><span><i class="dot"></i> 일정 <i class="dot green"></i> 필터 교체 <i class="dot blue"></i> 가족 일정</span><strong id="selectedLabel"></strong></div><div id="selectedAgenda" class="selected-agenda"></div></section>
<aside class="right-col"><section class="card filters-card"><div class="section-head"><div><div class="card-title">필터 관리</div><div class="section-sub">교체 주기를 놓치지 않도록 챙겨요</div></div><button class="small-add" id="addFilterBtn">＋ 추가</button></div><div class="filter-list" id="filterList"></div></section><section class="card events-card"><div class="card-title">다가오는 일정</div><div id="upcomingList"></div></section></aside><section id="appSettings" class="card settings-card"><div class="section-head"><div><div class="card-title">설정</div><div class="section-sub">앱 화면과 기본 항목을 관리해요</div></div></div><div class="settings-section"><div class="settings-copy"><strong>메인 사진</strong><span>홈 화면에 표시할 사진을 올리거나 삭제할 수 있어요.</span></div><img id="settingsPhotoPreview" class="settings-photo-preview" alt="현재 메인 사진" hidden><div class="settings-actions"><button id="uploadPhotoBtn" class="primary" type="button">사진 올리기</button><button id="removePhotoBtn" class="secondary" type="button" hidden>사진 삭제</button></div><input id="photoInput" type="file" accept="image/*" hidden></div><div class="settings-section"><div class="settings-copy"><strong>데이터 백업 및 복원</strong><span>일정, 필터, 메인 사진을 백업 파일로 저장하거나 복원할 수 있어요.</span></div><div class="settings-actions"><button id="backupButton" class="primary" type="button">백업 파일 저장</button><button id="restoreButton" class="secondary" type="button">백업 복원</button><input id="restoreInput" type="file" accept="application/json,.json" hidden></div></div></section></main>
</div><div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-top"><h2 id="modalTitle"></h2><button class="close" id="closeModal">×</button></div><form id="entryForm"></form></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), today=new Date();today.setHours(0,0,0,0);let view=new Date(today.getFullYear(),today.getMonth(),1),selected=new Date(today);const KEY='urijip-routine-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{events:[],filters:[]}}catch{data={events:[],filters:[]}};
const iso=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}, fromISO=s=>new Date(s+'T00:00:00'), fmt=(d,opts)=>new Intl.DateTimeFormat('ko-KR',opts).format(d), save=()=>localStorage.setItem(KEY,JSON.stringify(data)), daysBetween=(a,b)=>Math.ceil((fromISO(a)-fromISO(b))/86400000);
function occurrenceOn(event,date){const base=fromISO(event.date),d=fromISO(date);if(d<base)return false;const repeat=event.repeat||'none';if(repeat==='none')return d.getTime()===base.getTime();if(repeat==='weekly')return Math.round((d-base)/86400000)%7===0;if(repeat==='monthly'){const months=(d.getFullYear()-base.getFullYear())*12+d.getMonth()-base.getMonth();if(months<0)return false;const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()===Math.min(base.getDate(),last)}if(repeat==='yearly'){const last=new Date(d.getFullYear(),base.getMonth()+1,0).getDate();return d.getMonth()===base.getMonth()&&d.getDate()===Math.min(base.getDate(),last)}return false}
function drawCalendar(){ $('#monthLabel').textContent=fmt(view,{year:'numeric',month:'long'});const first=new Date(view.getFullYear(),view.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());let html='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);const key=iso(d),ev=data.events.some(e=>occurrenceOn(e,key)),fi=data.filters.some(f=>f.next===key);html+=`<div class="day ${d.getMonth()!==view.getMonth()?'out':''} ${key===iso(selected)?'selected':''}" data-date="${key}"><span class="num">${d.getDate()}</span>${ev?'<i class="dot"></i>':''}${fi?'<i class="dot green"></i>':''}</div>`}$('#calendarDays').innerHTML=html;$('#selectedLabel').textContent=fmt(selected,{month:'long',day:'numeric'})+' 선택';document.querySelectorAll('.day').forEach(el=>el.onclick=()=>{selected=fromISO(el.dataset.date);drawCalendar()});drawSelectedAgenda();drawUpcoming()}
function drawSelectedAgenda(){const key=iso(selected),items=data.events.map((event,index)=>({event,index})).filter(x=>occurrenceOn(x.event,key));$('#selectedAgenda').innerHTML=`<div class="agenda-head">${fmt(selected,{month:'long',day:'numeric'})} 일정</div>`+(items.length?items.map(({event,index})=>`<div class="agenda-row"><div class="agenda-copy"><div class="agenda-title">${esc(event.title)}</div><div class="agenda-meta">${event.time?esc(event.time):'종일'}${event.repeat&&event.repeat!=='none'?' · '+({weekly:'매주',monthly:'매월',yearly:'매년'}[event.repeat]):''}</div>${event.note?`<div class="agenda-note">${esc(event.note)}</div>`:''}</div><button class="edit-event" data-edit-event="${index}">수정</button></div>`).join(''):'<div class="empty">이 날짜에 등록된 일정이 없어요.</div>');document.querySelectorAll('[data-edit-event]').forEach(button=>button.onclick=()=>editEvent(Number(button.dataset.editEvent)))}
function drawFilters(){if(!data.filters.length){$('#filterList').innerHTML='<div class="empty">아직 등록된 필터가 없어요.<br>＋ 추가를 눌러 첫 필터를 등록해 보세요.</div>';return}$('#filterList').innerHTML=data.filters.map((f,index)=>{const n=daysBetween(f.next,iso(today)), label=n<0?`${-n}일 지남`:n===0?'오늘 교체':`D-${n}`,cls=n<=0?'late':n<=14?'soon':'';return `<div class="filter-item"><div class="filter-icon">${f.icon||'◉'}</div><div class="filter-info"><div class="filter-name">${esc(f.name)}</div><div class="filter-meta">${f.period}일 주기 · 다음 교체 ${fmt(fromISO(f.next),{month:'numeric',day:'numeric'})}</div></div><span class="due ${cls}">${label}</span><button class="edit-event" data-edit-filter="${index}">수정</button><div class="filter-order"><button type="button" data-move-filter="${index}" data-direction="-1" aria-label="${esc(f.name)} 위로 이동" ${index===0?'disabled':''}>▲</button><button type="button" data-move-filter="${index}" data-direction="1" aria-label="${esc(f.name)} 아래로 이동" ${index===data.filters.length-1?'disabled':''}>▼</button></div></div>`}).join('');document.querySelectorAll('[data-edit-filter]').forEach(button=>button.onclick=()=>editFilter(Number(button.dataset.editFilter)));document.querySelectorAll('[data-move-filter]').forEach(button=>button.onclick=()=>moveFilter(Number(button.dataset.moveFilter),Number(button.dataset.direction)))}
function moveFilter(index,direction){const next=index+direction;if(next<0||next>=data.filters.length)return;[data.filters[index],data.filters[next]]=[data.filters[next],data.filters[index]];save();drawFilters()}
